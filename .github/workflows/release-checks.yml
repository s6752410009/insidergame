name: Release checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [rules, integration, slave-browser, website-browser]
    env:
      CI: 'true'
      TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - if: contains(matrix.group, 'browser')
        run: npx playwright install --with-deps chromium
      - run: npm run test:release -- ${{ matrix.group }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-artifacts/
          retention-days: 7
          if-no-files-found: warn
  release-checks:
    name: Release checks passed
    if: always()
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every suite to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success

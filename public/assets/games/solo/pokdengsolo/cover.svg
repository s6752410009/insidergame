<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="ป๊อกเด้งท้าเจ้ามือ">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="1.05" r="0.95">
      <stop offset="0" stop-color="#3a2330"/>
      <stop offset="0.55" stop-color="#1f2838"/>
      <stop offset="1" stop-color="#141b27"/>
    </radialGradient>
    <radialGradient id="felt" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#b53a36"/>
      <stop offset="0.6" stop-color="#7e2127"/>
      <stop offset="1" stop-color="#4c151b"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe3cb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c86b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5c86b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diamonds" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M7 1 L13 7 L7 13 L1 7Z" fill="#1c4670"/>
    </pattern>
    <symbol id="heart" viewBox="-10 -10 20 20">
      <path d="M0 8.5 C-6 3.5 -9 0.5 -9 -3 C-9 -6.5 -6.3 -8.5 -3.8 -8.5 C-1.9 -8.5 -0.6 -7.2 0 -5.8 C0.6 -7.2 1.9 -8.5 3.8 -8.5 C6.3 -8.5 9 -6.5 9 -3 C9 0.5 6 3.5 0 8.5Z"/>
    </symbol>
    <symbol id="back" viewBox="0 0 100 140">
      <rect width="100" height="140" rx="9" fill="#0b2744"/>
      <rect x="5" y="5" width="90" height="130" rx="6" fill="#123a60" stroke="#f5c86b" stroke-width="2"/>
      <rect x="11" y="11" width="78" height="118" rx="4" fill="url(#diamonds)" stroke="#7eb6d9" stroke-opacity="0.5"/>
      <circle cx="50" cy="70" r="15" fill="#0b2744" stroke="#f5c86b" stroke-width="2"/>
      <path d="M50 60 L57 70 L50 80 L43 70Z" fill="#f5c86b"/>
    </symbol>
    <symbol id="chip" viewBox="-30 -12 60 24">
      <ellipse cx="0" cy="3" rx="28" ry="9" fill="#000" opacity="0.35"/>
      <rect x="-28" y="-6" width="56" height="8" fill="#0f1622"/>
      <ellipse cx="0" cy="2" rx="28" ry="9" fill="#0f1622"/>
      <ellipse cx="0" cy="-6" rx="28" ry="9" fill="#1a2332" stroke="#f5c86b" stroke-width="1.5"/>
      <ellipse cx="0" cy="-6" rx="18" ry="5.6" fill="none" stroke="#f5c86b" stroke-width="1.2" stroke-dasharray="3 3"/>
      <path d="M-28 -2 h6 v4 h-6z M22 -2 h6 v4 h-6z M-3 3 h6 v7 h-6z" fill="#f5c86b"/>
    </symbol>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- ลายจางๆ มุมบน -->
  <g fill="none" stroke="#f5c86b" stroke-opacity="0.08">
    <circle cx="320" cy="360" r="330"/>
    <circle cx="320" cy="360" r="300" stroke-dasharray="2 7"/>
  </g>

  <!-- โต๊ะ -->
  <ellipse cx="320" cy="430" rx="420" ry="215" fill="#120c12"/>
  <ellipse cx="320" cy="432" rx="404" ry="200" fill="#2a1a1d" stroke="#f5c86b" stroke-opacity="0.55" stroke-width="2.5"/>
  <ellipse cx="320" cy="438" rx="386" ry="186" fill="url(#felt)"/>
  <ellipse cx="320" cy="438" rx="330" ry="150" fill="none" stroke="#f5c86b" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- เจ้ามือ: ไพ่คว่ำ 2 ใบ -->
  <g transform="translate(404 44)">
    <g transform="rotate(-8 30 42)"><use href="#back" width="60" height="84"/></g>
    <g transform="translate(34 4) rotate(9 30 42)"><use href="#back" width="60" height="84"/></g>
  </g>
  <g transform="translate(450 150)" font-family="'Chakra Petch','Bai Jamjuree','Thonburi','Noto Sans Thai',sans-serif" font-weight="700" text-anchor="middle">
    <rect x="-44" y="-15" width="88" height="26" rx="13" fill="#0f1622" stroke="#f5c86b" stroke-opacity="0.6"/>
    <text y="4" font-size="14" fill="#f5c86b" letter-spacing="0.5">เจ้ามือ</text>
  </g>

  <!-- ผู้เล่น: ป๊อก 9 สองเด้ง (4♥ + 5♥) -->
  <ellipse cx="236" cy="200" rx="150" ry="110" fill="url(#glow)"/>
  <g transform="translate(160 96) rotate(-12 60 84)">
    <rect x="3" y="5" width="120" height="168" rx="12" fill="#000" opacity="0.35"/>
    <rect width="120" height="168" rx="12" fill="url(#paper)" stroke="#d2c4aa"/>
    <g fill="#c8232c" font-family="Georgia,'Times New Roman',serif" font-weight="700">
      <text x="16" y="34" font-size="28" text-anchor="middle">4</text>
      <use href="#heart" x="7" y="40" width="18" height="18"/>
      <use href="#heart" x="32" y="42" width="24" height="24"/>
      <use href="#heart" x="68" y="42" width="24" height="24"/>
      <use href="#heart" x="32" y="110" width="24" height="24"/>
      <use href="#heart" x="68" y="110" width="24" height="24"/>
    </g>
  </g>
  <g transform="translate(236 88) rotate(9 60 84)">
    <rect x="3" y="5" width="120" height="168" rx="12" fill="#000" opacity="0.35"/>
    <rect width="120" height="168" rx="12" fill="url(#paper)" stroke="#d2c4aa"/>
    <g fill="#c8232c" font-family="Georgia,'Times New Roman',serif" font-weight="700">
      <text x="16" y="34" font-size="28" text-anchor="middle">5</text>
      <use href="#heart" x="7" y="40" width="18" height="18"/>
      <use href="#heart" x="32" y="40" width="24" height="24"/>
      <use href="#heart" x="68" y="40" width="24" height="24"/>
      <use href="#heart" x="50" y="74" width="24" height="24"/>
      <use href="#heart" x="32" y="106" width="24" height="24"/>
      <use href="#heart" x="68" y="106" width="24" height="24"/>
    </g>
  </g>

  <!-- ป้าย ป๊อก 9 -->
  <g transform="translate(250 292)" font-family="'Chakra Petch','Bai Jamjuree','Thonburi','Noto Sans Thai',sans-serif" font-weight="700" text-anchor="middle">
    <rect x="-94" y="-26" width="188" height="48" rx="24" fill="#f5c86b"/>
    <rect x="-94" y="-26" width="188" height="48" rx="24" fill="none" stroke="#fff4d6" stroke-opacity="0.7" stroke-width="1.5"/>
    <text y="8" font-size="25" fill="#2a1a10">ป๊อก 9 · ×2</text>
  </g>

  <!-- กองชิป -->
  <g transform="translate(540 262)">
    <use href="#chip" x="-30" y="12" width="60" height="24"/>
    <use href="#chip" x="-30" y="2" width="60" height="24"/>
    <use href="#chip" x="-30" y="-8" width="60" height="24"/>
    <use href="#chip" x="-30" y="-18" width="60" height="24"/>
    <use href="#chip" x="-30" y="-28" width="60" height="24"/>
  </g>
  <g transform="translate(478 296)">
    <use href="#chip" x="-26" y="6" width="52" height="21"/>
    <use href="#chip" x="-26" y="-3" width="52" height="21"/>
    <use href="#chip" x="-26" y="-12" width="52" height="21"/>
  </g>

  <!-- ประกาย -->
  <g fill="#f5c86b">
    <path d="M118 70 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4z" opacity="0.9"/>
    <path d="M372 64 l2.5 7.5 l7.5 2.5 l-7.5 2.5 l-2.5 7.5 l-2.5 -7.5 l-7.5 -2.5 l7.5 -2.5z" opacity="0.8"/>
    <path d="M96 214 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z" opacity="0.6"/>
    <circle cx="560" cy="60" r="2.5" opacity="0.5"/>
    <circle cx="590" cy="120" r="1.8" opacity="0.4"/>
    <circle cx="60" cy="120" r="2" opacity="0.4"/>
  </g>
</svg>

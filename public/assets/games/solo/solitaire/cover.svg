<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="ไพ่โซลิแทร์">
  <defs>
    <radialGradient id="felt" cx="0.38" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#1f4a47"/>
      <stop offset="0.55" stop-color="#1a2d3a"/>
      <stop offset="1" stop-color="#1a2332"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f1e6cf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a0"/>
      <stop offset="1" stop-color="#e0a93e"/>
    </linearGradient>
    <pattern id="backPat" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#123a60"/>
      <path d="M6 1 L11 6 L6 11 L1 6Z" fill="#1a4a78"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#05090f" flood-opacity="0.55"/>
    </filter>
    <symbol id="spade" viewBox="0 0 20 22"><path d="M10 0C10 0 0 7.5 0 13.2 0 16.4 2.4 18.4 5 18.4 6.9 18.4 8.3 17.4 9 16.2L7.6 22H12.4L11 16.2C11.7 17.4 13.1 18.4 15 18.4 17.6 18.4 20 16.4 20 13.2 20 7.5 10 0 10 0Z"/></symbol>
    <symbol id="heart" viewBox="0 0 20 18"><path d="M10 18C10 18 0 11.2 0 5.3 0 2.2 2.4 0 5.2 0 7.3 0 9 1.3 10 3.1 11 1.3 12.7 0 14.8 0 17.6 0 20 2.2 20 5.3 20 11.2 10 18 10 18Z"/></symbol>
    <symbol id="club" viewBox="0 0 20 22"><circle cx="10" cy="5.2" r="4.8"/><circle cx="4.8" cy="11.4" r="4.8"/><circle cx="15.2" cy="11.4" r="4.8"/><path d="M8.4 12H11.6L13 22H7Z"/></symbol>
    <symbol id="diamond" viewBox="0 0 20 24"><path d="M10 0 20 12 10 24 0 12Z"/></symbol>
  </defs>

  <rect width="640" height="360" fill="url(#felt)"/>
  <g stroke="#f5c86b" stroke-opacity="0.08" fill="none">
    <circle cx="470" cy="190" r="150"/>
    <circle cx="470" cy="190" r="205"/>
  </g>

  <!-- ไพ่เด้งเป็นทาง (ฉลองชัยแบบคลาสสิก) -->
  <g opacity="0.9">
    <path d="M150 64 C 120 120 96 250 86 300 C 76 250 60 215 44 214 C 30 214 22 250 16 290" fill="none" stroke="#3fb58a" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <g transform="translate(20 236) rotate(-14)" opacity="0.3"><rect width="44" height="62" rx="5" fill="url(#paper)"/></g>
    <g transform="translate(40 190) rotate(-8)" opacity="0.45"><rect width="44" height="62" rx="5" fill="url(#paper)"/></g>
    <g transform="translate(66 238) rotate(-4)" opacity="0.6"><rect width="44" height="62" rx="5" fill="url(#paper)"/></g>
    <g transform="translate(86 158) rotate(6)" opacity="0.8">
      <rect width="44" height="62" rx="5" fill="url(#paper)"/>
      <text x="7" y="19" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#c41e3a">K</text>
      <use href="#heart" x="15" y="28" width="16" height="15" fill="#c41e3a"/>
    </g>
  </g>

  <!-- กองล่างเรียงลดหลั่น -->
  <g filter="url(#sh)" transform="translate(150 58)">
    <g>
      <rect width="86" height="120" rx="8" fill="#0b2744"/>
      <rect x="4" y="4" width="78" height="112" rx="6" fill="url(#backPat)" stroke="#d4a017" stroke-width="1.6"/>
    </g>
    <g transform="translate(0 22)">
      <rect width="86" height="120" rx="8" fill="#0b2744"/>
      <rect x="4" y="4" width="78" height="112" rx="6" fill="url(#backPat)" stroke="#d4a017" stroke-width="1.6"/>
    </g>
    <g transform="translate(0 44)">
      <rect width="86" height="120" rx="8" fill="url(#paper)" stroke="#d2c4aa"/>
      <text x="9" y="26" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#111">Q</text>
      <use href="#spade" x="34" y="7" width="16" height="18" fill="#111"/>
    </g>
    <g transform="translate(0 80)">
      <rect width="86" height="120" rx="8" fill="url(#paper)" stroke="#d2c4aa"/>
      <text x="9" y="26" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#c41e3a">J</text>
      <use href="#diamond" x="28" y="8" width="14" height="17" fill="#c41e3a"/>
    </g>
    <g transform="translate(0 116)">
      <rect width="86" height="120" rx="8" fill="url(#paper)" stroke="#d2c4aa"/>
      <text x="9" y="26" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#111">10</text>
      <use href="#club" x="44" y="8" width="16" height="18" fill="#111"/>
      <g fill="#111" opacity="0.9">
        <use href="#club" x="20" y="48" width="14" height="16"/>
        <use href="#club" x="52" y="48" width="14" height="16"/>
        <use href="#club" x="36" y="72" width="14" height="16"/>
      </g>
    </g>
  </g>

  <!-- ช่องเก็บ: A ทั้งสี่ดอกในกรอบทอง -->
  <g transform="translate(296 44)">
    <g filter="url(#sh)">
      <g transform="translate(0 0) rotate(-3 43 60)">
        <rect width="86" height="120" rx="8" fill="url(#paper)" stroke="#d2c4aa"/>
        <text x="9" y="26" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#111">A</text>
        <use href="#spade" x="25" y="42" width="36" height="40" fill="#111"/>
      </g>
      <g transform="translate(98 8) rotate(2 43 60)">
        <rect width="86" height="120" rx="8" fill="url(#paper)" stroke="#d2c4aa"/>
        <text x="9" y="26" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#c41e3a">A</text>
        <use href="#heart" x="24" y="44" width="38" height="34" fill="#c41e3a"/>
      </g>
      <g transform="translate(196 0) rotate(-2 43 60)">
        <rect width="86" height="120" rx="8" fill="url(#paper)" stroke="#d2c4aa"/>
        <text x="9" y="26" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#111">A</text>
        <use href="#club" x="25" y="40" width="36" height="40" fill="#111"/>
      </g>
    </g>
    <rect x="-8" y="-10" width="296" height="146" rx="14" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.7"/>
  </g>

  <!-- A ข้าวหลามตัดกำลังลอยขึ้นช่องเก็บ + เส้นทางแตะแล้วไปเอง -->
  <path d="M388 318 C 430 300 470 250 492 210" fill="none" stroke="#f5c86b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 8"/>
  <g filter="url(#sh)" transform="translate(470 196) rotate(9 43 60)">
    <rect width="86" height="120" rx="8" fill="url(#paper)" stroke="#f5c86b" stroke-width="2.5"/>
    <text x="9" y="26" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#c41e3a">A</text>
    <use href="#diamond" x="27" y="40" width="32" height="40" fill="#c41e3a"/>
  </g>
  <!-- จุดแตะ -->
  <g transform="translate(378 322)">
    <circle r="20" fill="#3fb58a" opacity="0.18"/>
    <circle r="11" fill="#3fb58a" opacity="0.4"/>
    <circle r="5" fill="#3fb58a"/>
  </g>
  <g fill="#f5c86b">
    <path d="M590 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z"/>
    <path d="M612 140 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5Z" opacity="0.7"/>
    <path d="M282 300 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5Z" opacity="0.5"/>
  </g>
</svg>

    <path d="M150 52 h42 a9 9 0 0 1 9 9 v18 a9 9 0 0 1 -9 9 h-22 l-10 10 v-10 h-10 a9 9 0 0 1 -9 -9 v-18 a9 9 0 0 1 9 -9z" fill="#fbf6ea"/>

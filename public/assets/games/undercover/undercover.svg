    <path d="M95 112 c8 3 17 4 25 4 s17 -1 25 -4 l1 6 c-8 2 -17 3 -26 3 s-18 -1 -26 -3z" fill="#f5c86b"/>
    <path d="M110 86 q10 6 20 0" stroke="#22303f" stroke-width="3" fill="none"/>

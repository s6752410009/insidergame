    <path d="M124 138 h24 v8 a9 9 0 0 1 -9 9 h-6 a9 9 0 0 1 -9 -9z" fill="#0f1620"/>
    <path d="M114 140 h12" stroke="#0f1620" stroke-width="3"/>
    <path d="M96 141 l6 0" stroke="#f5c86b" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>

      <stop offset="0" stop-color="#a8352f"/>
      <stop offset="1" stop-color="#3f1110"/>
    </linearGradient>
    <pattern id="ucHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <path d="M0 4 H8" stroke="#000000" stroke-opacity="0.12" stroke-width="1.2"/>
    </pattern>
    <clipPath id="ucWindow"><rect x="26" y="26" width="188" height="214" rx="94"/></clipPath>
  </defs>
  <rect width="240" height="336" rx="18" fill="#0f1620"/>
  <rect x="7" y="7" width="226" height="322" rx="13" fill="#1a2332"/>
  <rect x="15" y="15" width="210" height="306" rx="9" fill="none" stroke="#f5c86b" stroke-width="1.6"/>
  <g clip-path="url(#ucWindow)">
    <rect x="26" y="26" width="188" height="214" fill="url(#ucSky)"/>
    <rect x="26" y="26" width="188" height="214" fill="url(#ucHatch)"/>
    <!-- spotlight -->
    <path d="M120 26 L60 240 H180 Z" fill="#ffd9a0" fill-opacity="0.08"/>

    <path d="M120 176 l-26 12 22 56 4 -8z" fill="#22303f"/>
    <path d="M120 176 l26 12 -22 56 -4 -8z" fill="#22303f"/>
    <path d="M114 190 h12 l-6 40z" fill="#f5c86b"/>

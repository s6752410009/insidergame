    <path d="M40 78 h26 a7 7 0 0 1 7 7 v12 a7 7 0 0 1 -7 7 h-8 v7 l-7 -7 h-11 a7 7 0 0 1 -7 -7 v-12 a7 7 0 0 1 7 -7z" fill="#fbf6ea" fill-opacity="0.35"/>

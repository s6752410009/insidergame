<svg xmlns="http://www.w3.org/2000/svg" width="240" height="336" viewBox="0 0 240 336" role="img" aria-label="การ์ดบท Mr. White">
  <defs>
    <linearGradient id="mwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee0"/>
      <stop offset="1" stop-color="#c9bfa8"/>
    </linearGradient>
    <radialGradient id="mwMask" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ddcf"/>
    </radialGradient>
    <pattern id="mwDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1a2332" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="mwWindow"><rect x="26" y="26" width="188" height="214" rx="94"/></clipPath>
  </defs>
  <rect width="240" height="336" rx="18" fill="#0f1620"/>
  <rect x="7" y="7" width="226" height="322" rx="13" fill="#1a2332"/>
  <rect x="15" y="15" width="210" height="306" rx="9" fill="none" stroke="#f5c86b" stroke-width="1.6"/>
  <g clip-path="url(#mwWindow)">
    <rect x="26" y="26" width="188" height="214" fill="url(#mwSky)"/>
    <rect x="26" y="26" width="188" height="214" fill="url(#mwDots)"/>
    <!-- question marks drifting -->
    <g font-family="Chakra Petch, Tahoma, sans-serif" font-weight="700" fill="#1a2332">
      <text x="48" y="92" font-size="26" fill-opacity="0.18">?</text>
      <text x="178" y="84" font-size="20" fill-opacity="0.14">?</text>
      <text x="184" y="200" font-size="30" fill-opacity="0.16">?</text>
      <text x="40" y="212" font-size="22" fill-opacity="0.12">?</text>
    </g>
    <!-- mask shadow -->
    <path d="M124 70 c34 0 52 26 52 62 c0 46 -26 82 -52 82 s-52 -36 -52 -82 c0 -36 18 -62 52 -62z" fill="#1a2332" fill-opacity="0.18"/>
    <!-- blank mask -->
    <path d="M120 64 c34 0 52 26 52 62 c0 46 -26 82 -52 82 s-52 -36 -52 -82 c0 -36 18 -62 52 -62z" fill="url(#mwMask)" stroke="#1a2332" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M92 118 q10 -8 20 0 q-10 8 -20 0z" fill="#1a2332"/>
    <path d="M128 118 q10 -8 20 0 q-10 8 -20 0z" fill="#1a2332"/>
    <path d="M90 104 q11 -6 22 -1" stroke="#1a2332" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M128 103 q11 -5 22 1" stroke="#1a2332" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- no mouth: sealed line -->
    <path d="M110 170 h20" stroke="#1a2332" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
    <!-- mask ribbon -->
    <path d="M68 124 c-14 2 -24 -2 -30 -10" stroke="#f5c86b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M172 124 c14 2 24 -2 30 -10" stroke="#f5c86b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- empty word bubble -->
    <path d="M86 214 h68 a10 10 0 0 1 10 10 v24 h-88 v-24 a10 10 0 0 1 10 -10z" fill="#1a2332"/>
    <path d="M100 230 h40" stroke="#f5c86b" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>
  </g>
  <rect x="26" y="26" width="188" height="214" rx="94" fill="none" stroke="#f5c86b" stroke-width="2.5"/>
  <path d="M28 252 h184 l-10 17 10 17 h-184 l10 -17z" fill="#fbf6ea"/>
  <path d="M28 252 h184 l-10 17 10 17 h-184 l10 -17z" fill="none" stroke="#f5c86b" stroke-width="1.5"/>
  <text x="120" y="276" text-anchor="middle" font-family="Chakra Petch, Tahoma, sans-serif" font-size="20" font-weight="700" fill="#1a2332" letter-spacing="1">MR. WHITE</text>
  <text x="120" y="306" text-anchor="middle" font-family="Chakra Petch, Bai Jamjuree, Thonburi, Tahoma, sans-serif" font-size="9.5" font-weight="600" fill="#e8dcc0" letter-spacing="4">NO WORD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="วาดแล้วทาย">
  <defs>
    <radialGradient id="dgGlow" cx="58%" cy="40%" r="75%">
      <stop offset="0" stop-color="#26405e"/>
      <stop offset="0.55" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0f1620"/>
    </radialGradient>
    <pattern id="dgDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#7dd3fc" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="dgPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3ead6"/>
    </linearGradient>
    <linearGradient id="dgPencil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d579"/>
      <stop offset="0.5" stop-color="#f5c86b"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <filter id="dgShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="dgSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#dgGlow)"/>
  <rect width="1200" height="675" fill="url(#dgDots)"/>
  <circle cx="690" cy="280" r="300" fill="#38bdf8" fill-opacity="0.06"/>

  <!-- canvas board (4:3) -->
  <g transform="translate(690 285) rotate(-3)" filter="url(#dgShadow)">
    <rect x="-260" y="-200" width="520" height="390" rx="22" fill="#1a2332"/>
    <rect x="-246" y="-186" width="492" height="362" rx="14" fill="url(#dgPaper)"/>
    <!-- doodle: sun -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-150" cy="-100" r="38" stroke="#f28c28" stroke-width="10"/>
      <path d="M-150 -165 v18 M-150 -53 v18 M-215 -100 h18 M-103 -100 h18 M-196 -146 l12 12 M-116 -66 l12 12 M-104 -146 l-12 12 M-184 -66 l-12 12" stroke="#f28c28" stroke-width="8"/>
      <!-- elephant -->
      <path d="M-40 70 C-60 -10 0 -60 70 -55 C140 -50 175 -5 170 55 L170 95 M-40 70 L-40 110 M10 80 L10 112 M120 85 L120 112 M170 95 L170 112" stroke="#3b82f6" stroke-width="11"/>
      <path d="M-40 70 C-75 75 -95 100 -100 135 C-102 150 -88 152 -84 140" stroke="#3b82f6" stroke-width="11"/>
      <path d="M40 -40 C10 -10 20 40 70 30" stroke="#3b82f6" stroke-width="9"/>
      <circle cx="-8" cy="0" r="6" fill="#1f2430" stroke="none"/>
      <!-- ground -->
      <path d="M-210 135 C-120 120 -20 140 80 128 C150 120 200 132 225 128" stroke="#4caf50" stroke-width="9"/>
      <!-- cloud -->
      <path d="M95 -120 c-20 0 -30 -26 -6 -34 c4 -24 40 -26 48 -6 c22 -10 42 12 28 30 c10 14 -6 30 -24 22 c-12 10 -36 8 -46 -12 z" stroke="#8a8f98" stroke-width="7"/>
    </g>
  </g>

  <!-- pencil -->
  <g transform="translate(985 455) rotate(38)" filter="url(#dgSoft)">
    <rect x="-22" y="-190" width="44" height="210" rx="6" fill="url(#dgPencil)"/>
    <rect x="-22" y="-190" width="14" height="210" fill="#fff" fill-opacity="0.18"/>
    <rect x="-22" y="-218" width="44" height="34" rx="6" fill="#ec6fa8"/>
    <rect x="-22" y="-192" width="44" height="12" fill="#c8ccd4"/>
    <path d="M-22 20 L0 74 L22 20 Z" fill="#f3d9b1"/>
    <path d="M-8 54 L0 74 L8 54 Z" fill="#1a2332"/>
  </g>

  <!-- swatches -->
  <g filter="url(#dgSoft)">
    <circle cx="300" cy="540" r="26" fill="#e2493b"/>
    <circle cx="362" cy="566" r="26" fill="#f7d038"/>
    <circle cx="428" cy="580" r="26" fill="#4caf50"/>
    <circle cx="496" cy="584" r="26" fill="#3b82f6"/>
    <circle cx="564" cy="578" r="26" fill="#8b5cf6"/>
  </g>

  <!-- guess bubbles -->
  <g filter="url(#dgSoft)" font-family="'Chakra Petch','Bai Jamjuree',sans-serif" font-weight="700">
    <g transform="translate(250 120) rotate(-6)">
      <rect x="-118" y="-38" width="236" height="76" rx="38" fill="#22303f" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M40 34 L70 64 L70 30 Z" fill="#22303f"/>
      <text x="0" y="13" text-anchor="middle" font-size="36" fill="#e2e8f0">ไดโนเสาร์?</text>
    </g>
    <g transform="translate(205 300) rotate(4)">
      <rect x="-128" y="-38" width="256" height="76" rx="38" fill="#f5c86b"/>
      <path d="M60 30 L96 62 L92 28 Z" fill="#f5c86b"/>
      <text x="0" y="13" text-anchor="middle" font-size="36" fill="#1a2332">✓ ช้าง!</text>
    </g>
    <g transform="translate(1040 140) rotate(5)">
      <rect x="-60" y="-56" width="120" height="112" rx="56" fill="#38bdf8"/>
      <text x="0" y="22" text-anchor="middle" font-size="68" fill="#0f1620">?</text>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#f5c86b">
    <path d="M1120 540 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z"/>
    <path d="M120 470 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z" fill-opacity="0.8"/>
    <path d="M400 60 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z" fill="#7dd3fc"/>
  </g>
</svg>

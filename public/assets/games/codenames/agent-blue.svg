    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 5 H10" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="160" height="224" rx="14" fill="url(#bg)"/>
  <rect width="160" height="224" rx="14" fill="url(#hatch)"/>
  <circle cx="80" cy="104" r="64" fill="#ffffff" fill-opacity="0.09"/>
  <circle cx="80" cy="104" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 5"/>
  <!-- coat -->
  <path d="M18 224 C22 176 46 156 80 154 C114 156 138 176 142 224 Z" fill="#1a2332"/>
  <path d="M80 154 L64 156 L80 200 L96 156 Z" fill="#f4efe2"/>
  <path d="M80 162 L74 168 L80 196 L86 168 Z" fill="#3b82f6"/>
  <path d="M64 156 L52 162 L74 206 Z M96 156 L108 162 L86 206 Z" fill="#243247"/>
  <!-- neck + head -->
  <rect x="70" y="132" width="20" height="26" rx="6" fill="#1a2332"/>
  <ellipse cx="80" cy="114" rx="27" ry="30" fill="#1a2332"/>
  <!-- glasses -->
  <path d="M55 108 H105" stroke="#0b111b" stroke-width="3"/>
  <rect x="57" y="104" width="20" height="11" rx="5" fill="#0b111b"/>
  <rect x="83" y="104" width="20" height="11" rx="5" fill="#0b111b"/>

  <path d="M86 107 h7" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <!-- hat -->
  <ellipse cx="80" cy="88" rx="50" ry="10" fill="#1a2332"/>
  <path d="M52 88 C52 62 61 50 80 50 C99 50 108 62 108 88 Z" fill="#1a2332"/>
  <path d="M68 52 C74 58 86 58 92 52" stroke="#2b3a52" stroke-width="3" fill="none"/>
  <rect x="53" y="78" width="54" height="8" fill="#f5c86b"/>

ke="#f5c86b" stroke-opacity="0.45" stroke-width="1.5"/></g><g transform="translate(0 440)"><use href="#tile"/><text x="75.0" y="60.0" font-size="30" fill="#1a2332">กุญแจ</text></g><g transform="translate(164 440)"><use href="#tile"/><text x="75.0" y="60.0" font-size="30" fill="#1a2332">ไข่มุก</text></g><g transform="translate(328 440)"><rect width="150" height="96" rx="12" fill="#2f6fd1"/><rect width="150" height="96" rx="12" fill="url(#hatch)"/><g transform="translate(75.0 92)" fill="#1a2332"><use href="#agent"/></g><rect x="4" y="4" width="142" height="88" rx="9" fill="none" stroke="#f5c86b" stroke-opacity="0.45" stroke-width="1.5"/></g><g transform="translate(492 440)"><use href="#tile"/><text x="75.0" y="60.0" font-size="26" fill="#1a2332">ลูกเต๋า</text></g><g transform="translate(656 440)"><use href="#tile"/><text x="75.0" y="60.0" font-size="30" fill="#1a2332">นินจา</text></g>

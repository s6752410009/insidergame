<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="853" viewBox="0 0 1280 853" role="img" aria-label="สายลับคำใบ้">
  <defs>
    <radialGradient id="glow" cx="62%" cy="48%" r="70%">
      <stop offset="0" stop-color="#2c3e58"/>
